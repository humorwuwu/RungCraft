name: Release

# 推送 v* 标签时自动构建并发布 Release；也可以在 Actions 页面手动运行。
# 手动运行时默认使用 package.json 的版本号（tag 为 v<version>），
# 也可以填自定义 tag（如 v0.2.0-rc.1），含 "-" 的 tag 会自动标记为预发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空则使用 v<package.json 版本>）'
        required: false
        type: string
        default: ''
      draft:
        description: '创建为草稿（不公开）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    # 需要 macOS 自带的 sips / iconutil 生成 RungCraft.app，
    # 同时产出与本地 npm run package 一致的 zip。
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 质量检查
        run: |
          npm run lint
          npm run test:run

      - name: 构建
        run: npm run build

      - name: 生成 macOS 启动器并打包
        run: |
          npm run launcher
          npm run package -- --skip-build

      - name: 解析并校验版本
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")
          ZIP="$NAME-$VERSION.zip"

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::tag ${TAG} 与 package.json 版本 ${VERSION} 不一致（应为 v${VERSION}）"
              exit 1
            fi
          else
            TAG="${INPUT_TAG:-v$VERSION}"
            case "$TAG" in
              v[0-9]*) ;;
              *)
                echo "::error::tag 必须以 v 加版本号开头：${TAG}"
                exit 1
                ;;
            esac
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::warning::tag ${TAG} 与 package.json 版本 v${VERSION} 不一致，附件版本仍为 ${VERSION}"
            fi
            # 手动发布时若同名 tag 已存在，必须指向本次构建的提交，避免把产物发到旧 tag 上。
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              TAG_SHA=$(git rev-list -n 1 "refs/tags/$TAG")
              if [ "$TAG_SHA" != "$COMMIT_SHA" ]; then
                echo "::error::tag ${TAG} 已存在，且指向 ${TAG_SHA}（本次提交为 ${COMMIT_SHA}）"
                exit 1
              fi
            fi
          fi

          if [ ! -f "$ZIP" ]; then
            echo "::error::打包产物不存在：$ZIP"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "发布 tag：${TAG}，版本：${VERSION}，产物：${ZIP}"

      - name: 生成 SHA-256 校验和
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
        run: shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: rungcraft-${{ steps.meta.outputs.version }}
          path: |
            rungcraft-*.zip
            rungcraft-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
          COMMIT_SHA: ${{ github.sha }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          NOTES="## 下载与运行

          下载 \`$ZIP\` 并核对 \`$ZIP.sha256\` 后解压。需要 Node.js 20 或更高版本，无需执行 \`npm install\`：

          - macOS：双击 \`RungCraft.app\`（推荐）或 \`start-rungcraft.command\`
          - Windows：双击 \`start-rungcraft.bat\`
          - 命令行：\`node scripts/serve.mjs\`

          首次打开从网络下载的 \`.app\` / \`.command\` 时，macOS 可能提示「无法验证开发者」：在图标上右键 → 打开 一次即可。"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传附件。"
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            ARGS=(release create "$TAG" "$ZIP" "$ZIP.sha256"
              --title "RungCraft $VERSION"
              --generate-notes
              --notes "$NOTES"
              --target "$COMMIT_SHA")
            case "$TAG" in
              *-*) ARGS+=(--prerelease) ;;
            esac
            if [ "${DRAFT:-false}" = "true" ]; then
              ARGS+=(--draft)
            fi
            gh "${ARGS[@]}"
          fi

      - name: 写入工作流摘要
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          set -euo pipefail
          URL=$(gh release view "$TAG" --json url --jq .url)
          SHA=$(cut -d' ' -f1 "$ZIP.sha256")
          {
            echo "## RungCraft $VERSION"
            echo
            echo "- Release：$URL"
            echo "- 附件：\`$ZIP\`、\`$ZIP.sha256\`"
            echo "- SHA-256：\`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
